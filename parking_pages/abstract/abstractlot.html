<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check in</title>
  <link rel="stylesheet" href="/ParkingPals-Fall-2025-Repo/parking_pages/abstract/abstractlot.css"/>
  <script type="module" src="/ParkingPals-Fall-2025-Repo/parking_pages/abstract/abstractlot.js"></script>
</head>

<body>
  <main id="main-holder">
    <h1 id="checkin-header"></h1>
    <p id="total-spots-title">Total Spots:</p>
    <p id="total-spots"></p>
    <p id="avail-big-title">Available Spots:</p>
    <p id="p1" class="avail_title">Live Data</p>
    <p id="availability-slot" class="number"></p>
    <p id="p2" class="avail_title">Past Trends</p>
    <p id="availability-slot-past" class="number"></p>
    <p id="p3" class="avail_title">Predicted</p>
    <p id="availability-slot-combined" class="number"></p>
    <form id="checkin-box" class="box">
      <input type="submit" value="Check in" id="checkin-box-submit">
    </form>
    <form id="checkout-box" class="box">
      <input type="submit" value="Check Out" id="checkout-box-submit">
    </form>
    <form id="return-form">
      <input type="submit" value="Return" id="return-form-submit">
    </form>
  
  </main>
</body>

</html>
