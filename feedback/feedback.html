<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>
  <link rel="stylesheet" href="/ParkingPals-Fall-2025-Repo/feedback/feedback.css">
  <script type="module" src="/ParkingPals-Fall-2025-Repo/feedback/feedback.js"></script>
</head>

<body>
  <main id="main-holder">
    <h1 id="feedback-header">Feed Back Form</h1>
    
    <form id="feedback-form">
      <textarea type="text" rows = "10" columns = "50" name="feedback" id="fieldback-field" class="feedback-form-field" placeholder="Feedback"></textarea>
      <input type="submit" value="Submit" id="feedback-form-submit">
    </form>

    <form id="return-form">
      <input type="submit" value="Return" id="return-form-submit">
    </form>

  </main>
</body>

</html>
